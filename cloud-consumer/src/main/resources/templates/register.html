<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../static/css/login-style.css">
</head>

<body>
<!--  整体-->

<div class="container right-panel-active">
    <!--注册框-->
    <div class="container_from container--signup">
        <form action="" class="from" id="from1">
            <h2 class="from_title">注册账号</h2>
            <input type="text" placeholder="User" class="input">
            <input type="email" placeholder="Email" class="input">
            <input type="password" placeholder="Password" class="input">
            <button class="btn">点击注册</button>
        </form>
    </div>

    <!--登录框-->
    <div class="container_from container--signin">
        <form action="" class="from" id="from2">
            <h2 class="from_title">欢迎登录</h2>
            <input type="text" placeholder="User" class="input">
            <input type="password" placeholder="Password" class="input">
            <a href ="#" class="link">忘记密码？</a>
            <button class="btn">立即登录</button>
        </form>
    </div>

    <div class="container_overlay">
        <div class="overlay">
            <div class="overlay_panel overlay--left">
                <button class="btn" id="signup">没有账号，用户注册</button>
            </div>

            <div class="overlay_panel overlay--righ">
                <button class="btn" id="signin">已有账号，直接登录</button>

                <!-- <button class="btn">没有账号，商家注册</button>-->
            </div>
        </div>
    </div>

</div>
</body>
<script src="../static/js/login-script.js"></script>
</html>

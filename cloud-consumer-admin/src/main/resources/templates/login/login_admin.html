<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>登录页面 - 光年(Light Year Admin V4)后台管理系统模板</title>
  <link rel="icon" href="images/favicon.ico" type="image/ico">
  <meta name="keywords" content="LightYear,LightYearAdmin,光年,后台模板,后台管理系统,光年HTML模板">
  <meta name="description" content="Light Year Admin V4是一个后台管理系统的HTML模板，基于Bootstrap v4.4.1。">
  <meta name="author" content="yinqi">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/materialdesignicons.min.css" rel="stylesheet">
  <link href="css/style.min.css" rel="stylesheet">
  <style>
    .login-form .has-feedback {
      position: relative;
    }
    .login-form .has-feedback .form-control {
      padding-left: 36px;
    }
    .login-form .has-feedback .mdi {
      position: absolute;
      top: 0;
      left: 0;
      right: auto;
      width: 36px;
      height: 36px;
      line-height: 36px;
      z-index: 4;
      color: #dcdcdc;
      display: block;
      text-align: center;
      pointer-events: none;
    }
    .login-form .has-feedback.row .mdi {
      left: 15px;
    }
  </style>
</head>

<body class="center-vh" style="background-image: url(images/back.jpg); background-size: cover;">
<div class="card card-shadowed p-5 w-420 mb-0 mr-2 ml-2" >
  <div class="text-center mb-3">
    <a th:href="@{/login}"> <img alt="light year admin" src="images/logo-sidebar.png"> </a>
  </div>

  <form th:action="@{/login}" method="post" class="login-form">
    <div class="form-group has-feedback">
      <span class="mdi mdi-account" aria-hidden="true"></span>
      <input type="text" class="form-control" id="username" placeholder="用户名" name="username" >
    </div>

    <div class="form-group has-feedback">
      <span class="mdi mdi-lock" aria-hidden="true"></span>
      <input type="password" class="form-control" id="password" placeholder="密码" name="password">
    </div>
    <div class="form-group has-feedback row">
      <div class="col-7">
        <span class="mdi mdi-check-all form-control-feedback" aria-hidden="true"></span>
        <input type="text" name="captcha" class="form-control" placeholder="验证码">
      </div>
      <div class="col-5 text-right">
        <img src="/cap.jpg/1" class="pull-right" id="captcha" style="cursor: pointer;" title="点击刷新" alt="captcha">
      </div>
      <div style="margin-left: 15px">
        <span th:text="${failinfo}" style='color:red;font-size:15px;margin-left: 15px;'></span>
      </div>
    </div>
    <div class="form-group">
      <div class="custom-control custom-checkbox">
        <input type="checkbox" class="custom-control-input" id="rememberme" name="remember-me" value="true">
        <label class="custom-control-label not-user-select" for="rememberme">5天内自动登录</label>
      </div>
    </div>

    <div class="form-group">
      <button class="btn btn-block btn-primary" type="submit">立即登录</button>
    </div>
  </form>

  <p class="text-center text-muted mb-0">Copyright© 2021 <font color="red">不秃头小队</font> .All right reserved</p>
</div>

<script type="text/javascript" src="js/jquery.min.js"></script>
<script type="text/javascript">
    $("form :input").blur(function () {
        let par = $(this).parent();

        if($(this).is("#username")) {
            let uname = $.trim(this.value);
            var regName = /[~#^$@%&!*()<>:;'"{}【】  ]/;
            if (uname == "") {
                var obj1 = document.getElementById("u errormsg");
                $(obj1).remove();
                par.append("<span id='u errormsg' style='color:red;font-size:13px;margin-left: 15px;'>*用户名不能为空！</span>")
            }
            else if(regName.test(uname)) {
                var obj2 = document.getElementById("u errormsg");
                $(obj2).remove();
                par.append("<span id='u errormsg' style='color:red;font-size:13px;margin-left: 15px;'>*用户名含有非法字符！</span>")
            }
            else{
                var obj3 = document.getElementById("u errormsg");
                $(obj3).remove();
            }
        }
        if($(this).is("#password")){
            let uname = $.trim(this.value);
            var regName = /[~#^$@%&!*()<>:;'"{}【】  ]/;
            if (uname == "") {
                var obj1 = document.getElementById("p errormsg");
                $(obj1).remove();
                par.append("<span id='p errormsg' style='color:red;font-size:13px;margin-left: 15px;'>*密码不能为空！</span>")
            }
            else{
                var obj3 = document.getElementById("p errormsg");
                $(obj3).remove();
            }
        }
    });
</script>
<script>
  function Code() {
    console.info("刷新！");
    document.getElementById("captcha").src="/cap.jpg/"+Math.random();
  }
  document.getElementById("captcha").onclick=Code;
</script>
</body>
</html>
